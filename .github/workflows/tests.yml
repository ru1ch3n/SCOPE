name: Software checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/setup.py --cpu --env-only
      - run: .venv/bin/python -m ruff check .
      - run: .venv/bin/python -m pytest -q
